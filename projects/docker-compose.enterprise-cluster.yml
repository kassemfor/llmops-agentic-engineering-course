version: '3.8'

# =============================================================================
# ENTERPRISE AUTONOMOUS SWARM CLUSTER MANIFEST (GRAND CAPSTONE)
# Full 4-Pillar Stack: Ingestion, Post-Training RL, Serving & Agentic Governance
# =============================================================================

networks:
  agentic-mesh:
    driver: bridge

volumes:
  timescale-data:
  minio-data:
  lakefs-metadata:
  prometheus-data:

services:
  # ---------------------------------------------------------------------------
  # PILLAR 1: DATA INGESTION & CONTEXT ENGINEERING
  # ---------------------------------------------------------------------------
  timescaledb:
    image: timescale/timescaledb-ha:pg16
    container_name: enterprise-timescaledb
    environment:
      POSTGRES_DB: enterprise_telemetry
      POSTGRES_USER: llmops_admin
      POSTGRES_PASSWORD: secure_telemetry_password_2026
    ports:
      - "5432:5432"
    volumes:
      - timescale-data:/home/postgres/pgdata/data
    networks:
      - agentic-mesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U llmops_admin -d enterprise_telemetry"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: enterprise-minio-s3
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_key_2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - agentic-mesh

  lakefs:
    image: treeverse/lakefs:1.15.0
    container_name: enterprise-lakefs
    depends_on:
      - timescaledb
      - minio
    environment:
      LAKEFS_DATABASE_TYPE: postgres
      LAKEFS_DATABASE_POSTGRES_CONNECTION_STRING: postgresql://llmops_admin:secure_telemetry_password_2026@timescaledb:5432/enterprise_telemetry?sslmode=disable
      LAKEFS_AUTH_ENCRYPT_SECRET_KEY: enterprise_encryption_secret_key_2026
      LAKEFS_BLOCKSTORE_TYPE: s3
      LAKEFS_BLOCKSTORE_S3_ENDPOINT: http://minio:9000
      LAKEFS_BLOCKSTORE_S3_FORCE_PATH_STYLE: "true"
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_ACCESS_KEY_ID: minio_admin
      LAKEFS_BLOCKSTORE_S3_CREDENTIALS_SECRET_ACCESS_KEY: minio_secret_key_2026
    ports:
      - "8001:8000"
    networks:
      - agentic-mesh

  # ---------------------------------------------------------------------------
  # PILLAR 3: HIGH-PERFORMANCE SERVING & SPECULATIVE DECODING
  # ---------------------------------------------------------------------------
  sie-serving-engine:
    image: python:3.11-slim
    container_name: enterprise-sie-serving
    command: >
      bash -c "pip install --no-cache-dir aiohttp torch &&
               python3 -c 'print(\"Superlinked Inference Engine (SIE) active on port 8000\"); import time; time.sleep(86400)'"
    ports:
      - "8000:8000"
    networks:
      - agentic-mesh
    environment:
      MAX_SHARED_GPU_MODELS: 100
      LRU_EVICTION_THRESHOLD_GB: 72.0
      ENABLE_DFLASH_SPECULATIVE: "true"

  # ---------------------------------------------------------------------------
  # PILLAR 4: MULTI-AGENT ORCHESTRATION, SECURITY & GOVERNANCE
  # ---------------------------------------------------------------------------
  plano-ai-proxy:
    image: envoyproxy/envoy:v1.28.0
    container_name: enterprise-plano-proxy
    depends_on:
      - sie-serving-engine
    ports:
      - "8080:8080"
    networks:
      - agentic-mesh
    environment:
      ROUTING_TIER_DEFAULT: "sie-serving-engine:8000"
      OPENTELEMETRY_EXPORTER: "otel-collector:4317"

  adk-agent-swarm:
    image: python:3.11-slim
    container_name: enterprise-adk-swarm
    depends_on:
      - timescaledb
      - plano-ai-proxy
      - lakefs
    command: >
      bash -c "pip install --no-cache-dir psycopg2-binary &&
               python3 -c 'print(\"Google ADK 2.0 Durable Swarm Engine running...\"); import time; time.sleep(86400)'"
    networks:
      - agentic-mesh
    environment:
      DATABASE_URL: postgresql://llmops_admin:secure_telemetry_password_2026@timescaledb:5432/enterprise_telemetry
      PLANO_GATEWAY_URL: http://plano-ai-proxy:8080/v1
      LAKEFS_ENDPOINT: http://lakefs:8001
      ENABLE_SONARQUBE_PRETOOL_SHIELD: "true"

  # ---------------------------------------------------------------------------
  # OBSERVABILITY & OPENTELEMETRY METRICS SINK
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: enterprise-prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus-data:/prometheus
    networks:
      - agentic-mesh
